# Docker's embedded DNS: re-resolves the app so a restarted container's new IP is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app {
    zone app 64k;
    server app:3000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;

    # Matches the server actions body size limit in next.config.ts.
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        # Overwrites any client value: the contact form rate limit keys on this address (getClientIp).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Host $http_host;

        # Dev server hot reload over WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Lets streamed responses (loading.tsx, Suspense) reach the browser as they render.
        proxy_buffering off;
    }
}
