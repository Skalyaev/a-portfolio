name: portfolio

x-app-common: &app-common
  init: true
  container_name: portfolio-app
  env_file: .env

x-proxy-common: &proxy-common
  init: true
  container_name: portfolio-proxy
  build:
    context: ./proxy
  image: portfolio-proxy

services:
  app-dev:
    <<: *app-common
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: portfolio-app:dev
    volumes:
      - ./postcss.config.mjs:/home/node/workdir/postcss.config.mjs
      - ./next.config.ts:/home/node/workdir/next.config.ts
      - ./tsconfig.json:/home/node/workdir/tsconfig.json
      - ./public:/home/node/workdir/public
      - ./src:/home/node/workdir/src

  app-prod:
    <<: *app-common
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      target: prod
      secrets:
        - env
    image: portfolio-app:prod

  proxy-dev:
    <<: *proxy-common
    profiles: ["dev"]
    ports:
      - "80:8080"
    depends_on:
      - app-dev

  # Loopback only: the host's Traefik is the single entry point.
  proxy-prod:
    <<: *proxy-common
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-8081}:8080"
    depends_on:
      - app-prod

secrets:
  env:
    file: .env
