name: portfolio

x-app-common: &app-common
  init: true
  container_name: portfolio-app
  env_file: .env

x-proxy-common: &proxy-common
  init: true
  container_name: portfolio-proxy
  build:
    context: ./proxy
  image: portfolio-proxy

services:
  app-dev:
    <<: *app-common
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: portfolio-app:dev
    volumes:
      - ./postcss.config.mjs:/home/node/workdir/postcss.config.mjs
      - ./next.config.ts:/home/node/workdir/next.config.ts
      - ./tsconfig.json:/home/node/workdir/tsconfig.json
      - ./public:/home/node/workdir/public
      - ./src:/home/node/workdir/src

  app-prod:
    <<: *app-common
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      target: prod
      secrets:
        - env
    image: portfolio-app:prod

  proxy-dev:
    <<: *proxy-common
    profiles: ["dev"]
    ports:
      - "80:8080"
    depends_on:
      - app-dev

  proxy-prod:
    <<: *proxy-common
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - app-prod
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.portfolio.rule: Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)
      traefik.http.routers.portfolio.entrypoints: websecure
      traefik.http.routers.portfolio.tls.certresolver: letsencrypt
      traefik.http.routers.portfolio.middlewares: portfolio-www,portfolio-headers
      traefik.http.middlewares.portfolio-www.redirectregex.regex: ^https?://www\.(.+)
      traefik.http.middlewares.portfolio-www.redirectregex.replacement: https://$${1}
      traefik.http.middlewares.portfolio-www.redirectregex.permanent: "true"
      traefik.http.middlewares.portfolio-headers.headers.stsSeconds: "31536000"
      traefik.http.services.portfolio.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true

secrets:
  env:
    file: .env
